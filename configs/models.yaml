# Where each model runs and what it costs. Prices are USD per token, except Muse Voice Transcribe (USD per hour of
# audio). A key whose comment names an environment variable can be overridden by it.

muse_glimmer:
  served_name: mg30                      # PORTIA_GLIMMER_MODEL ("portia-glimmer" on the Modal Endpoint)
  servers:                               # PORTIA_GLIMMER_SERVERS, as JSON: [["<url>/v1", "<label>"], ...]
    - ["http://127.0.0.1:18660/v1", "server 1"]
    - ["http://127.0.0.1:18661/v1", "server 2"]
  sampling: {temperature: 1.0, top_p: 0.95, top_k: 64}      # the model card's sampling; never greedy

muse_spark_13:
  api_url: "https://api.meta.ai/v1"
  model: muse-spark-1.3-contributor     # PORTIA_SPARK13_MODEL
  price: {in: 1.0e-07, cached: 2.0e-09, out: 2.0e-07}

muse_spark_open:
  api_url: "https://inference.baseten.co/v1"
  model: meta-models/muse-spark-open-1026
  price: {in: 1.25e-06, cached: 1.5e-07, out: 4.25e-06}

muse_voice_transcribe:
  url: "https://api.meta.ai/v1/asr/transcribe"
  model: muse-voice-transcribe-1.0
  usd_per_hour: 0.18
  part_seconds: 360                      # the file endpoint takes at most 10 minutes and 32 MB per request

query_encoder:                           # the search index's model, from before the hackathon
  url: "http://127.0.0.1:18531"
  model: Qwen/Qwen3-VL-Embedding-8B
  revision: 418d03899aeb9d954e776dfa762006616519a914
  pod: {name: "<pod>", kubeconfig: "~/.kube/config", root: /path/to/portia, port: 18531}   # only with PORTIA_ENCODER=pod

openrouter:                              # the first experiments' judge (before Muse Glimmer ran locally)
  url: "https://openrouter.ai/api/v1/chat/completions"
  model: "nvidia/nemotron-3.5-super-vl:free"

fireworks:                               # scripts/deploy_fireworks.py
  api: "https://api.fireworks.ai/v1"
  model: accounts/fireworks/models/muse-glimmer-30b
  shape: {accelerator: NVIDIA_H200_141GB, precision: BF16}
  replicas: {min: 0, max: 1}
  scale_to_zero_seconds: 300
